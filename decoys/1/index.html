<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuaris — coming soon</title>
<meta name="description" content="Nuaris is under development. Something new is coming soon.">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="grain"></span>
</div>
<main class="wrap">
  <p class="brand">Nuaris</p>
  <div class="loader" aria-hidden="true">
    <svg viewBox="0 0 200 200" class="ring-svg">
      <circle class="track" cx="100" cy="100" r="84"/>
      <g class="spin"><circle class="arc" cx="100" cy="100" r="84"/></g>
      <g class="spin rev"><circle class="arc2" cx="100" cy="100" r="64"/></g>
    </svg>
    <div class="orbit o1"><i></i></div>
    <div class="orbit o2"><i></i></div>
    <div class="orbit o3"><i></i></div>
    <div class="core"></div>
  </div>
  <h1>Something new<br><span>is coming soon</span></h1>
  <p class="tag">We are putting it together. You will see it very soon.</p>
  <div class="progress" role="progressbar" aria-label="Work in progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72">
    <div class="bar"><span></span></div>
    <p>Work in progress<em class="dots"><b>.</b><b>.</b><b>.</b></em></p>
  </div>
  <p class="note">Site under development · launching soon</p>
</main>
</body>
</html>
